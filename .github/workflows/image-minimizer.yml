name: Image Minimizer

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

jobs:
  check-github-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check optional GitHub App credentials
        id: check
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image Minimizer requires APP_ID and APP_PRIVATE_KEY; skipping the optional job until they are configured."
          fi

  call-image-minimizer-workflow:
    needs: check-github-app
    if: needs.check-github-app.outputs.available == 'true'
    uses: FossifyOrg/.github/.github/workflows/image-minimizer.yml@main
    secrets: inherit
