name: Build custom APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew :app:assembleCoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-apk
          path: app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
