name: Build custom APK

on:
  workflow_dispatch:
  push:
    branches: [main, "build/**"]
    # Release-note-only commits are handled by update-release-notes.yml.
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"

concurrency:
  group: build-custom-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Updating release prose alone must not replace an already distributed APK.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[notes-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms-forwarder-release.jks"

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Test forwarding and power regressions
        run: |
          python3 scripts/test_battery_queries.py
          python3 scripts/test_forwarding_history_sql.py
          python3 scripts/test_conversation_feedback_sql.py
          python3 scripts/test_sms_direct_guard_sql.py
          python3 scripts/test_queue_repair_sql.py
          python3 scripts/test_forwarding_integration_sql.py
          python3 tools/incoming-sms-ui-host-tests/run.py
          ./gradlew :app:testCoreDebugUnitTest :app:compileCoreDebugAndroidTestKotlin :app:assembleCoreDebug

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/sms-forwarder-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :app:assembleCoreRelease

      - name: Verify release and normalize filename
        shell: bash
        run: |
          source_apk="$(find app/build/outputs/apk/core/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p deliverables
          apk="deliverables/SMS-Forwarder-${{ steps.version.outputs.name }}-release.apk"
          cp "$source_apk" "$apk"
          if unzip -p "$apk" 'classes*.dex' | strings | grep -Fq 'You are using a fake version'; then
            echo 'Blocked: upstream fake-version warning remains in release bytecode.' >&2
            exit 1
          fi
          jarsigner -verify "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee deliverables/signature.txt
          grep -Fq '227d5ed7b74462e37d6e88c424eb0aad58a33acb1b6e193f2e2d08a650107c96' deliverables/signature.txt
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Forwarder-${{ steps.version.outputs.name }}-release
          path: |
            deliverables/SMS-Forwarder-${{ steps.version.outputs.name }}-release.apk
            deliverables/SMS-Forwarder-${{ steps.version.outputs.name }}-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.name }}"
          tag="v$version"
          apk="deliverables/SMS-Forwarder-$version-release.apk"
          checksum="$apk.sha256"
          # Only use a successful GitHub API response. A 404 can emit JSON on stdout,
          # which must never be passed to git as a commit SHA.
          existing_tag_sha=""
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            existing_tag_sha="$(printf '%s' "$tag_ref" | jq -r '.object.sha // empty')"
            existing_tag_type="$(printf '%s' "$tag_ref" | jq -r '.object.type // empty')"
            if [ "$existing_tag_type" != "commit" ] || [[ ! "$existing_tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Tag $tag has an unexpected object; refusing to publish an unverified APK." >&2
              exit 1
            fi
          fi
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            # Preserve published tags and assets. Each distinct source needs a new version.
            echo "::error::Tag $tag points to $existing_tag_sha, not $GITHUB_SHA. Not replacing published assets; the signed APK remains in Actions artifacts. Bump VERSION_NAME for a new release."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            echo "Release $tag assets replaced with build from $GITHUB_SHA."
          else
            gh release create "$tag" "$apk" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "短信转发器 $version" \
              --generate-notes
          fi
          notes="docs/release-$version.md"
          if [ -f "$notes" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
