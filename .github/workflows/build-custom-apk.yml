name: Build custom APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build optimized unsigned release APK
        run: ./gradlew :app:assembleCoreRelease

      - name: Collect local signing tool
        run: |
          mkdir -p app/build/signing-tool
          cp "$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)" app/build/signing-tool/apksigner.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-unsigned-release
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/signing-tool/apksigner.jar
          if-no-files-found: error
